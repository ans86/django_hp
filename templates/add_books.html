<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'game.css' %}">  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>


<style>
    .rating {
    display: flex;
    flex-direction: row-reverse;
    justify-content: center;
}
.rating input {
    display: none;
}
.rating label {
    font-size: 2rem;
    color: lightgray;
    cursor: pointer;
}
.rating input:checked ~ label {
    color: gold;
}
.rating label:hover,
.rating label:hover ~ label {
    color: gold;
}
</style>

<div class="container mt-5">
<a href="{% url 'authors' %}" class="btn btn-primary">← Back</a>

  <!-- Add Book Form -->

  <div class="d-flex justify-content-center align-items-center p-5 mt-5">
    <form class="custom-form" style="margin-top: 50px;" method="post" action="{% url 'add_books' author.id %}" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3" style="width: 400px;">
        <label for="title" class="form-label"><b>Title</b></label>
        <input name="title" type="text" class="form-control" id="title" placeholder="Enter Title">
      </div>

      <div class="mb-3" style="width: 400px;">
        <label for="formFile" class="form-label"><b>Select Image</b></label>
        <input name="image" class="form-control" type="file" id="formFile">
      </div>

      <div class="mb-3" style="width: 400px;">
        <label for="author" class="form-label"><b>Author</b></label>
        <input name="author" type="text" class="form-control" id="author" placeholder="Enter Author">
      </div>

      <div class="mb-3" style="width: 400px;">
        <label for="publishyear" class="form-label"><b>Publish Year</b></label>
        <input name="publishyear" type="number" class="form-control" id="publishyear" placeholder="Publish Year">
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
</div>
</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>


</body>
</html>
