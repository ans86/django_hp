<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">  
</head>

<style>
    .right-btn {
    float: right;
}

</style>

<body>
    <div class="container mt-5">
<a href="{% url 'authors' %}" class="btn btn-primary">← Back</a>
    

<div class="container">

    
<br><br>
<!-- Loop -->

{% load static %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Books by {{ author.name }}</h2>
    <a href="{% url 'add_books' author.id %}" class="btn btn-success right-btn">+ Add Book</a>
</div>
<hr>
<br>
<div class="row">
    {% if books %}
        {% for book in books %}
            <div class="col-md-2 mb-2">
                <div class="card h-100 shadow-sm">
                    <img src="{{ book.image.url }}" class="card-img-top" alt="{{ book.title }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ book.title }}</h5>
                        <p class="card-text">{{ book.books|truncatewords:15 }}</p>
                        <p class="text-muted"><strong>Year:</strong> {{ book.publishyear }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <div class="col-12">
            <div class="alert alert-info text-center">
                No books available for {{ author.name }}
            </div>
        </div>
    {% endif %}
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
